<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>预判 · ANTICIPATE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0d14'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fb7185' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23fb7185'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05060a; --ink:#e8eef7; --muted:#8592a6; --dim:#5b6678;
    --cyan:#22d3ee; --rose:#fb7185; --amber:#fbbf24; --violet:#a78bfa;
    --line:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); background:
      radial-gradient(1100px 620px at 82% -12%, rgba(124,58,237,.30), transparent 62%),
      radial-gradient(900px 520px at -8% 112%, rgba(8,145,178,.22), transparent 60%),
      var(--bg);
    font-family:ui-sans-serif,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100dvh;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  #app{width:min(92vw,520px); display:flex; flex-direction:column; gap:14px; padding:18px 0}
  header{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{display:flex; align-items:baseline; gap:10px; font-weight:600; letter-spacing:.02em}
  .brand b{font-size:19px}
  .brand em{font-style:normal; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
            font-size:10px; letter-spacing:.24em; color:var(--dim); text-transform:uppercase}
  .stats{display:flex; align-items:center; gap:14px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px}
  .hearts{display:flex; gap:5px}
  .hp{width:11px;height:11px; border-radius:3px; background:var(--rose);
      box-shadow:0 0 12px rgba(251,113,133,.55); transition:.25s}
  .hp.off{background:#2a2f3a; box-shadow:none; opacity:.6}
  .score{color:var(--muted)}
  .score b{color:var(--ink); font-weight:600; font-size:15px}

  .stage{position:relative; border-radius:20px; overflow:hidden;
         border:1px solid var(--line);
         box-shadow:0 30px 80px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.02) inset;}
  canvas{display:block; width:100%; height:auto; touch-action:manipulation}

  .hint{display:flex; align-items:center; justify-content:space-between; gap:12px;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--dim);
        min-height:18px}
  .hint .now{color:var(--muted)}
  .hint .now b{color:var(--rose); font-weight:700; letter-spacing:.08em}
  .hint .acc{white-space:nowrap}

  footer{text-align:center; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
         font-size:11px; color:#4a5364; letter-spacing:.04em}

  .veil{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:12px; text-align:center; padding:26px;
        background:rgba(5,6,10,.72); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
        transition:opacity .25s; z-index:5}
  .veil.hide{opacity:0; pointer-events:none}
  .veil h1{margin:0; font-size:46px; letter-spacing:.16em; font-weight:700;
           background:linear-gradient(100deg,#a5f3fc,#c4b5fd 45%,#fda4af);
           -webkit-background-clip:text; background-clip:text; color:transparent}
  .veil .sub{margin:0; font-size:13px; color:var(--muted); line-height:1.95; max-width:330px}
  .veil .big{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
             color:var(--dim); letter-spacing:.14em}
  .veil .statsGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin:2px 0}
  .veil .statsGrid div{display:flex; flex-direction:column; gap:4px}
  .veil .statsGrid span{font-size:10px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase}
  .veil .statsGrid b{font-size:21px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .cta{margin-top:4px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
       color:var(--ink); border:1px solid rgba(255,255,255,.14); padding:9px 18px; border-radius:999px;
       background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02)); cursor:pointer}
  .cta:hover{border-color:rgba(255,255,255,.28)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>预判</b><em>anticipate</em></div>
    <div class="stats">
      <div class="hearts" id="hearts"></div>
      <div class="score"><b id="score">0</b> 枚</div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="board"></canvas>
    <div class="veil" id="veil"></div>
  </div>

  <div class="hint">
    <div class="now" id="now">它正在看你的下一步。</div>
    <div class="acc" id="acc"></div>
  </div>

  <footer>↑ ↓ ← → / WASD 移动　点击相邻格</footer>
</div>

<script>
(() => {
"use strict";

/* ───────────────────────── 常量 ───────────────────────── */
const N = 7;
const CELL = 64;
const SIZE = N * CELL;
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
const DIR_ARROW = ["↑","→","↓","←"];
const START_HEARTS = 3;
const ORB_LIFE = 14;             // 光点存活回合数，过期掉一格血

/* 散点柱体：制造局部绕路，但不形成死走廊 */
const WALLS = new Set([
  "1,1","5,1","4,2","2,4","5,4","1,5"
]);
const isWall = (x,y) => WALLS.has(x + "," + y);

const cvs = document.getElementById("board");
const ctx = cvs.getContext("2d");
const veil = document.getElementById("veil");
const heartsEl = document.getElementById("hearts");
const scoreEl = document.getElementById("score");
const nowEl = document.getElementById("now");
const accEl = document.getElementById("acc");

/* ───────────────────────── 状态 ───────────────────────── */
const S = {
  phase: "title",
  px: 3, py: 3,
  orb: { x: 5, y: 3, t: ORB_LIFE },
  marks: [],
  hearts: START_HEARTS,
  orbs: 0, score: 0, turns: 0, hits: 0, level: 1,
  lastMove: 0,
  table: new Map(),
  pendingKey: null,
  pendingCounts: null,
  trail: [],
  particles: [],
  floats: [],
  shake: 0, flash: 0, flashColor: "#fb7185",
  blind: 0,
  t0: performance.now(),
  lastEvent: "",
};

/* ───────────────────────── 工具 ───────────────────────── */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rnd = (a=1) => Math.random() * a;
const inside = (x,y) => x >= 0 && y >= 0 && x < N && y < N;
const free = (x,y) => inside(x,y) && !isWall(x,y);
const dist = (ax,ay,bx,by) => Math.abs(ax-bx) + Math.abs(ay-by);

function dirTo(ax,ay,bx,by){
  const dx = Math.sign(bx-ax), dy = Math.sign(by-ay);
  if (dx === 1) return 1;
  if (dx === -1) return 3;
  if (dy === 1) return 2;
  return 0;
}

/* ───────────────────────── 音效 ───────────────────────── */
let AC = null;
function audio(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, dur=.12, type="sine", gain=.06, slide=0){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq+slide), ac.currentTime+dur);
  g.gain.setValueAtTime(gain, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
  o.connect(g).connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur+.02);
}

/* ───────────────────────── 预测器 ─────────────────────────
   上下文 = 玩家所在 3×3 区域 × 光点相对方向(3×3) × 上一步(4)
   每个上下文记 4 个方向的计数；先验偏向"朝光点走"，
   所以第一局它就懂你的意图，之后慢慢学会你躲它的习惯。
*/
function ctxKey(){
  const zone = Math.floor(S.px/3) + Math.floor(S.py/3)*3;
  const ox = Math.sign(S.orb.x - S.px) + 1;
  const oy = Math.sign(S.orb.y - S.py) + 1;
  return ((zone*3 + ox)*3 + oy)*4 + S.lastMove;
}

function priorCounts(){
  const c = new Float32Array(4);
  c[0]=c[1]=c[2]=c[3]=0.5;
  const dx = S.orb.x - S.px, dy = S.orb.y - S.py;
  if (Math.abs(dx) >= Math.abs(dy)) { if (dx > 0) c[1] += 0.35; else if (dx < 0) c[3] += 0.35; }
  if (Math.abs(dy) >= Math.abs(dx)) { if (dy > 0) c[2] += 0.35; else if (dy < 0) c[0] += 0.35; }
  return c;
}

function predict(){
  // 刚被命中：它短暂失明，这一回合不猜——防止在走廊里被连续点名
  if (S.blind > 0){
    S.blind--;
    S.pendingKey = null;
    S.marks = [];
    return;
  }
  const key = ctxKey();
  let c = S.table.get(key);
  if (!c) c = priorCounts();
  S.pendingKey = key;
  S.pendingCounts = c;

  const opts = [];
  for (let a=0;a<4;a++){
    if (free(S.px + DIRS[a][0], S.py + DIRS[a][1])) opts.push(a);
  }
  if (!opts.length){ S.marks = []; return; }

  const soft = 0.6;
  const scored = opts.map(a => [a, Math.pow(c[a], soft) * (0.88 + rnd(0.24))]);
  scored.sort((p,q) => q[1]-p[1]);

  const want = S.level;   // 1 → 2 → 3 个标记
  S.marks = scored.slice(0, Math.min(want, scored.length)).map(([a]) => ({
    x: S.px + DIRS[a][0], y: S.py + DIRS[a][1]
  }));
}

function learn(action){
  if (S.pendingKey == null) return;
  let c = S.table.get(S.pendingKey);
  if (!c){ c = S.pendingCounts.slice(); S.table.set(S.pendingKey, c); }
  c[action] += 1;
}

/* ───────────────────────── 回合 ───────────────────────── */
function startGame(){
  S.phase = "play";
  S.px = 3; S.py = 3;
  S.hearts = START_HEARTS;
  S.orbs = 0; S.score = 0; S.turns = 0; S.hits = 0; S.level = 1;
  S.lastMove = 0;
  S.table.clear();
  S.trail = []; S.particles = []; S.floats = [];
  S.shake = 0; S.flash = 0; S.blind = 0;
  spawnOrb();
  S.marks = [];
  predict();
  veil.classList.add("hide");
  refreshHud();
  updateNowLine();
  audio();
  tone(520,.08,"triangle",.05,120);
}

function spawnOrb(){
  let x, y, guard = 0;
  do {
    x = Math.floor(rnd(N)); y = Math.floor(rnd(N)); guard++;
  } while (guard < 300 && (!free(x,y) || (x===S.px && y===S.py) || dist(x,y,S.px,S.py) < 3));
  S.orb = { x, y, t: ORB_LIFE };
}

function playTurn(action){
  if (S.phase !== "play") return;
  const nx = S.px + DIRS[action][0], ny = S.py + DIRS[action][1];
  if (!free(nx,ny)) return;

  const hit = S.marks.some(m => m.x === nx && m.y === ny);
  const picked = (nx === S.orb.x && ny === S.orb.y);

  learn(action);

  S.trail.push({ x:S.px, y:S.py, life:1 });
  S.px = nx; S.py = ny;
  S.lastMove = action;
  S.turns++;

  if (hit){
    S.hearts--;
    S.hits++;
    S.blind = 1;   // 下一回合它看不见你
    S.shake = Math.min(15, 8 + S.shake);
    S.flash = .55; S.flashColor = "#fb7185";
    burst(S.px, S.py, 26, "#fb7185");
    floatText(S.px, S.py, "它猜中了", "#fb7185");
    tone(120,.24,"sawtooth",.08,-60);
  }

  if (picked){
    S.orbs++;
    S.score += S.level;
    burst(nx, ny, 22, "#fbbf24");
    floatText(nx, ny, "+" + S.level + " ♥", "#fbbf24");
    tone(760,.09,"sine",.06,380);
    S.flash = .3; S.flashColor = "#fbbf24";
    if (S.hearts < START_HEARTS){ S.hearts++; }   // 光点就是血源
    if (S.orbs === 8 && S.level < 2){
      S.level++;
      floatText(S.px, S.py-1, "标记 +1", "#a78bfa");
      tone(300,.2,"sawtooth",.05,-120);
    }
    spawnOrb();
  } else {
    S.orb.t--;
    if (S.orb.t <= 0){
      S.hearts--;
      S.shake = Math.min(15, 6 + S.shake);
      S.flash = .45; S.flashColor = "#fb7185";
      burst(S.orb.x, S.orb.y, 16, "#fb7185");
      floatText(S.orb.x, S.orb.y, "它熄灭了", "#fb7185");
      tone(90,.3,"sine",.06,-30);
      if (S.hearts > 0) spawnOrb();
    }
  }

  refreshHud();
  if (S.hearts <= 0){ gameOver(); return; }

  predict();
  updateNowLine();
}

function gameOver(){
  S.phase = "over";
  const acc = S.turns ? Math.round(S.hits / S.turns * 100) : 0;
  veil.innerHTML = `
    <div class="big">GAME OVER</div>
    <h1 style="font-size:32px">它读对了 ${acc}%</h1>
    <p class="sub">它猜了你 ${S.turns} 步，命中 ${S.hits} 次。<br>你带走了 ${S.orbs} 枚光点。</p>
    <div class="statsGrid">
      <div><span>score</span><b>${S.score}</b></div>
      <div><span>orbs</span><b>${S.orbs}</b></div>
      <div><span>level</span><b>${S.level}</b></div>
    </div>
    <button class="cta" id="again">再来一局 ⏎</button>`;
  veil.classList.remove("hide");
  document.getElementById("again").onclick = startGame;
  audio(); tone(220,.4,"sine",.06,-90);
}

/* ───────────────────────── 反馈 ───────────────────────── */
function updateNowLine(){
  if (S.blind > 0){ nowEl.innerHTML = `<b style="color:#a78bfa">它暂时看不见你</b>`; return; }
  if (!S.marks.length){ nowEl.textContent = "……"; return; }
  const arrows = S.marks.map(m => DIR_ARROW[dirTo(S.px,S.py,m.x,m.y)]).join(" ");
  nowEl.innerHTML = `它猜你下一步：<b>${arrows}</b>`;
}

function burst(x, y, n, color){
  const cx = x*CELL+CELL/2, cy = y*CELL+CELL/2;
  for (let i=0;i<n;i++){
    const a = rnd(Math.PI*2), sp = 40 + rnd(180);
    S.particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color,size:1+rnd(2.4)});
  }
}

function floatText(x, y, text, color){
  S.floats.push({ x: x*CELL+CELL/2, y: (y+.5)*CELL, text, color, life:1 });
}

function refreshHud(){
  heartsEl.innerHTML = "";
  for (let i=0;i<START_HEARTS;i++){
    const d = document.createElement("div");
    d.className = "hp" + (i < S.hearts ? "" : " off");
    heartsEl.appendChild(d);
  }
  scoreEl.textContent = S.score;
  const acc = S.turns ? Math.round(S.hits / S.turns * 100) : 0;
  accEl.textContent = S.turns ? `命中 ${acc}% · L${S.level}` : "";
}

/* ───────────────────────── 绘制 ───────────────────────── */
function draw(now){
  const t = (now - S.t0) / 1000;
  const dpr = window.devicePixelRatio || 1;
  if (cvs.width !== SIZE*dpr){
    cvs.width = SIZE*dpr; cvs.height = SIZE*dpr;
    cvs.style.height = SIZE + "px";
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,SIZE,SIZE);

  const bg = ctx.createLinearGradient(0,0,SIZE,SIZE);
  bg.addColorStop(0,"#080b12"); bg.addColorStop(1,"#0a0d16");
  ctx.fillStyle = bg; ctx.fillRect(0,0,SIZE,SIZE);

  drawAurora(t);

  let ox = 0, oy = 0;
  if (S.shake > .1){
    ox = (rnd(2)-1) * S.shake; oy = (rnd(2)-1) * S.shake;
    S.shake *= .86;
  }
  ctx.save(); ctx.translate(ox, oy);

  drawGrid();
  drawWalls();
  drawTrail();
  drawMarks(t);
  if (S.phase === "play" && S.orb.x >= 0) drawOrb(t);
  drawPlayer(t);
  drawParticles();
  drawFloats();

  ctx.restore();

  if (S.flash > .01){
    ctx.fillStyle = S.flashColor;
    ctx.globalAlpha = S.flash * .26;
    ctx.fillRect(0,0,SIZE,SIZE);
    ctx.globalAlpha = 1;
    S.flash *= .88;
  }
}

function drawAurora(t){
  const blobs = [
    { x: SIZE*.82 + Math.sin(t*.17)*40, y: SIZE*.1 + Math.cos(t*.13)*30, r: SIZE*.55, c: "124,58,237" },
    { x: SIZE*.1 + Math.cos(t*.11)*40,  y: SIZE*.95 + Math.sin(t*.19)*26, r: SIZE*.5,  c: "8,145,178" },
    { x: SIZE*.55 + Math.sin(t*.09)*60, y: SIZE*.55 + Math.cos(t*.15)*40, r: SIZE*.42, c: "190,24,93" },
  ];
  for (const b of blobs){
    const g = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,`rgba(${b.c},.15)`);
    g.addColorStop(1,`rgba(${b.c},0)`);
    ctx.fillStyle = g; ctx.fillRect(0,0,SIZE,SIZE);
  }
}

function drawGrid(){
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    if (isWall(x,y)) continue;
    roundRect(ctx, x*CELL+2, y*CELL+2, CELL-4, CELL-4, 10);
    ctx.strokeStyle = "rgba(255,255,255,.05)";
    ctx.lineWidth = 1; ctx.stroke();
  }
}

function drawWalls(){
  for (const key of WALLS){
    const [x,y] = key.split(",").map(Number);
    const g = ctx.createLinearGradient(x*CELL, y*CELL, x*CELL+CELL, y*CELL+CELL);
    g.addColorStop(0,"#242d3f"); g.addColorStop(1,"#141a26");
    roundRect(ctx, x*CELL+3, y*CELL+3, CELL-6, CELL-6, 12);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.10)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x*CELL+14, y*CELL+7);
    ctx.lineTo(x*CELL+CELL-14, y*CELL+7);
    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1; ctx.stroke();
  }
}

function drawMarks(t){
  for (const m of S.marks){
    const cx = m.x*CELL+CELL/2, cy = m.y*CELL+CELL/2;
    const k = 1 + Math.sin(t*5)*.07;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL*.36*k, 0, Math.PI*2);
    ctx.fillStyle = "rgba(251,113,133,.09)";
    ctx.fill();
    ctx.strokeStyle = "rgba(251,113,133,.55)";
    ctx.lineWidth = 1.5; ctx.stroke();

    const r = CELL*.29, L = 8;
    ctx.strokeStyle = "rgba(251,113,133,.95)";
    ctx.lineWidth = 2;
    for (const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
      ctx.beginPath();
      ctx.moveTo(cx+sx*r, cy+sy*r - sy*L);
      ctx.lineTo(cx+sx*r, cy+sy*r);
      ctx.lineTo(cx+sx*r - sx*L, cy+sy*r);
      ctx.stroke();
    }
  }
}

function drawOrb(t){
  const cx = S.orb.x*CELL+CELL/2, cy = S.orb.y*CELL+CELL/2;
  const life = clamp(S.orb.t / ORB_LIFE, 0, 1);
  const pulse = 1 + Math.sin(t*4)*.1;

  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,CELL*.62);
  g.addColorStop(0,"rgba(251,191,36,.42)");
  g.addColorStop(1,"rgba(251,191,36,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,CELL*.62,0,Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.arc(cx,cy,9*pulse,0,Math.PI*2);
  ctx.fillStyle = "#fde68a"; ctx.fill();

  ctx.beginPath();
  ctx.arc(cx,cy,CELL*.33, -Math.PI/2, -Math.PI/2 + Math.PI*2*life);
  ctx.strokeStyle = life > .34 ? "rgba(251,191,36,.45)" : "rgba(251,113,133,.85)";
  ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.stroke();
  ctx.lineCap = "butt";
}

function drawTrail(){
  for (let i=0;i<S.trail.length;i++){
    const p = S.trail[i];
    const a = (i+1)/S.trail.length * .16;
    ctx.beginPath();
    ctx.arc(p.x*CELL+CELL/2, p.y*CELL+CELL/2, 3, 0, Math.PI*2);
    ctx.fillStyle = `rgba(34,211,238,${a})`;
    ctx.fill();
  }
}

function drawPlayer(t){
  const cx = S.px*CELL+CELL/2, cy = S.py*CELL+CELL/2;
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,CELL*.7);
  g.addColorStop(0,"rgba(34,211,238,.32)");
  g.addColorStop(1,"rgba(34,211,238,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,CELL*.7,0,Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.arc(cx,cy,11,0,Math.PI*2);
  ctx.fillStyle = "#e6feff"; ctx.fill();
  ctx.strokeStyle = "rgba(34,211,238,.95)"; ctx.lineWidth = 2; ctx.stroke();

  ctx.beginPath(); ctx.arc(cx,cy,17 + Math.sin(t*3)*1.6,0,Math.PI*2);
  ctx.strokeStyle = "rgba(34,211,238,.2)"; ctx.lineWidth = 1; ctx.stroke();
}

function drawParticles(){
  for (let i=S.particles.length-1;i>=0;i--){
    const p = S.particles[i];
    p.x += p.vx*.016; p.y += p.vy*.016;
    p.vx *= .96; p.vy *= .96; p.life -= .018;
    if (p.life <= 0){ S.particles.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloats(){
  ctx.textAlign = "center";
  for (let i=S.floats.length-1;i>=0;i--){
    const f = S.floats[i];
    f.y -= .55; f.life -= .012;
    if (f.life <= 0){ S.floats.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1, f.life*1.4);
    ctx.fillStyle = f.color;
    ctx.font = "600 12px ui-monospace,Menlo,monospace";
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = "left";
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* ───────────────────────── 主循环 ───────────────────────── */
function loop(now){
  S.trail = S.trail.filter(p => (p.life -= .012) > 0);
  draw(now);
  requestAnimationFrame(loop);
}

/* ───────────────────────── 输入 ───────────────────────── */
const KEYMAP = {
  ArrowUp:0, KeyW:0, ArrowRight:1, KeyD:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3
};

window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();

  if (S.phase === "title"){ if (e.code === "Space" || e.code === "Enter") startGame(); return; }
  if (S.phase === "over"){ if (e.code === "Enter" || e.code === "Space") startGame(); return; }

  const a = KEYMAP[e.code];
  if (a !== undefined) playTurn(a);
}, { passive:false });

cvs.addEventListener("pointerdown", (e) => {
  if (S.phase !== "play"){ startGame(); return; }
  const r = cvs.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * N);
  const y = Math.floor((e.clientY - r.top) / r.height * N);
  if (!free(x,y)) return;
  if (dist(x,y,S.px,S.py) === 1) playTurn(dirTo(S.px,S.py,x,y));
});

/* ───────────────────────── 初始画面 ───────────────────────── */
function title(){
  veil.innerHTML = `
    <h1>预判</h1>
    <p class="sub">它每一步都会先公布自己的猜测，再等你走。<br>
    踩进它圈出的格子，掉一格血。<br><br>
    它靠你走路的习惯活着——<br>你越有章法，它越准。</p>
    <button class="cta" id="start">开始 ⏎</button>
    <div class="big" style="margin-top:4px">↑↓←→ / WASD</div>`;
  veil.classList.remove("hide");
  document.getElementById("start").onclick = startGame;
}

refreshHud();
title();
requestAnimationFrame(loop);

window.__G = S;
window.__playTurn = playTurn;
window.__walls = WALLS;
})();
</script>
